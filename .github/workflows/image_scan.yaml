name: Image Scan

on:
  push:
    branches:
      - "main"
      - "scratch/**"
  schedule:
    - cron: "53 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy (${{ matrix.command_name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - command_name: controller
            image_name: controller
          - command_name: extproc
            image_name: extproc
          - command_name: aigw
            image_name: cli
    env:
      IMAGE: docker.io/envoyproxy/ai-gateway-${{ matrix.image_name }}:${{ github.sha }}
    steps:
      # Tags give the binaries a release version, so Trivy does not match the main module against old advisories.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - run: make docker-build.${{ matrix.command_name }} TAG=${{ github.sha }} DOCKER_BUILD_ARGS="--load"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.image_name }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"
          skip-setup-trivy: true

  # Trivy cannot identify the Envoy binary in the aigw image, so the pinned Envoy release is checked against OSV by commit.
  envoy:
    name: Envoy (.envoy-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Query OSV for the pinned Envoy release
        run: |
          version="$(tr -d '[:space:]' < .envoy-version)"
          repo=https://github.com/envoyproxy/envoy
          commit="$(git ls-remote "$repo" "refs/tags/v${version}^{}" | cut -f1)"
          commit="${commit:-$(git ls-remote "$repo" "refs/tags/v${version}" | cut -f1)}"
          if [ -z "$commit" ]; then
            echo "::error::Envoy tag v${version} not found"
            exit 1
          fi
          ids="$(curl -sSf -X POST https://api.osv.dev/v1/query -d "{\"commit\":\"${commit}\"}" | jq -r '.vulns[]?.id')"
          if [ -n "$ids" ]; then
            echo "::error::Envoy v${version} (${commit}) is affected by: $(echo "$ids" | tr '\n' ' ')"
            exit 1
          fi
          echo "Envoy v${version} (${commit}): no known vulnerabilities in OSV"
